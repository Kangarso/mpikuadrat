<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Misi Kuadrat: Jelajah Akar Imajiner</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#173b62;background:#cbeaf4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#dff4f8,#cbeaf4 55%,#9bd3c7)}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:.8rem 1.2rem;min-height:48px;color:#173b62;background:#fff6e4;box-shadow:0 4px 0 #9cb4b2;font-weight:750}button:hover{filter:brightness(.97)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #9cb4b2}button:focus-visible,input:focus-visible{outline:4px solid #8066b0;outline-offset:3px}.primary{background:#f29b38;box-shadow:0 5px 0 #b86322}.cover{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:clamp(24px,6vw,90px);overflow:hidden;position:relative}.cover:after{content:'';position:absolute;bottom:-15vh;left:-5%;width:110%;height:36vh;background:#70b5a7;border-radius:50% 50% 0 0;z-index:-1}.logo{font-size:clamp(3rem,7vw,7rem);line-height:.95;color:#fff6e4;letter-spacing:-.04em;-webkit-text-stroke:2px #173b62;text-shadow:3px 4px #173b62,6px 8px #b86322;margin:.2em 0}.cover .primary{font-size:1.4rem;padding:1rem 3rem}.world{text-align:center}.world svg{max-width:550px;width:100%;height:auto}.app{max-width:1200px;margin:auto;padding:clamp(16px,3vw,36px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1,h2,h3{line-height:1.15}h1{font-size:clamp(2rem,4vw,3.2rem);margin:.3em 0}h2{font-size:clamp(1.5rem,3vw,2.3rem)}p,li{line-height:1.65}p{max-width:70ch}.panel{background:#fff9ed;border:2px solid #d3e7dc;border-radius:24px;padding:clamp(20px,3vw,38px);box-shadow:0 9px 0 #9fc8be}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{min-height:170px;background:#fff6e4;border:2px solid #fff;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:1.1rem;box-shadow:0 6px 0 #8cbdb5}.icon{font-size:3.2rem;line-height:1}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}.diagram{background:#e4f4f1;border-radius:22px;padding:20px;text-align:center}.diagram svg{width:100%;max-width:420px;height:auto}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:28px;flex-wrap:wrap}.stack{display:grid;gap:12px}.option{text-align:left;background:#fff;border:2px solid #bdd8d2;box-shadow:none}.option.selected{border:3px solid #8066b0;background:#eee8fa}.notice{background:#e0f3eb;border-left:6px solid #38a99c;padding:14px;border-radius:8px;margin:16px 0}.warn{background:#fff0d9;border-left-color:#f29b38}.muted{color:#46677a}.small{font-size:.9rem}input,select{padding:12px;border:2px solid #8ab6b0;border-radius:10px;width:100%;background:white;color:#173b62;min-height:48px}label{font-weight:700}.fields{display:grid;gap:16px;max-width:500px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.track{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.step{min-width:42px;padding:8px;background:#dcefe9;border-radius:10px;text-align:center}.step.active{background:#f29b38;font-weight:800}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:440px}td,th{border:1px solid #abc9c2;padding:10px;text-align:center}th{background:#d9eee9}.progress{height:10px;background:#d8e8e4;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#38a99c}.sr{position:absolute;left:-9999px}.score{font-size:2.3rem;font-weight:900}.question{font-size:1.15rem;font-weight:750}.tag{display:inline-block;background:#e4f2ef;padding:5px 10px;border-radius:10px;font-size:.85rem} @media(max-width:700px){.cover{grid-template-columns:1fr;text-align:center;align-content:center;gap:8px;padding:24px}.cover .world svg{max-height:32vh}.logo{font-size:clamp(3rem,13vw,5rem)}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.card{min-height:135px}.app{padding:16px}.nav button{flex:1}.nav{position:relative}}@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.card{font-size:.95rem;padding:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.developer-profile{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-bottom:24px}.developer-profile img{width:min(250px,100%);height:auto;aspect-ratio:1172 / 1342;object-fit:cover;border-radius:22px;border:5px solid #fff;box-shadow:0 6px 18px #173b6233}.developer-profile h2{margin:.3em 0}
/* Tata letak adaptif: menjaga isi tetap terbaca di layar sentuh dan layar besar. */
html{overflow-x:hidden}body{min-height:100svh;overflow-wrap:anywhere}button{touch-action:manipulation;max-width:100%}button:disabled{cursor:not-allowed;opacity:.68}input,select{font-size:16px;max-width:100%}.cover{min-height:100svh;overflow:visible;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}.cover>div,.split>div,.panel,.grid>*{min-width:0}.logo{overflow-wrap:normal}.world svg{display:block;margin:auto}.app{width:100%;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom))}.card{width:100%;overflow-wrap:anywhere}.option{width:100%}.nav button{min-width:0}.fields label{display:grid;gap:6px}.row button{min-width:48px}.diagram{overflow:hidden}.tag{max-width:100%}
@media (min-width:701px) and (max-width:1024px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.cover{gap:16px}.logo{font-size:clamp(3.1rem,6.8vw,5rem)}}
@media (max-width:700px){.cover{padding: max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));min-height:100svh}.cover .world svg{max-height:min(32svh,260px);width:auto;max-width:100%}.logo{font-size:clamp(2.4rem,11vw,4.5rem);line-height:1.02}.cover .primary{width:min(100%,320px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.split{grid-template-columns:minmax(0,1fr);gap:18px}.panel{padding:20px 16px}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.nav button{padding:10px 5px;font-size:.88rem;min-height:48px}.diagram{padding:12px}}
@media (max-width:360px){.logo{font-size:clamp(2rem,10.5vw,2.4rem)}.grid{grid-template-columns:1fr}.card{min-height:110px}.nav{grid-template-columns:1fr 1fr}.nav button:last-child{grid-column:1/-1}.panel{padding:16px 12px}}
@media (max-height:500px) and (orientation:landscape){.cover{grid-template-columns:1fr 1fr;text-align:left;align-content:start;gap:12px}.cover .world svg{max-height:65svh}.cover .logo{font-size:clamp(2rem,6vw,3.5rem)}.cover .primary{width:auto}.panel{padding:18px}.app header{margin-bottom:8px}.app h1{margin:.2em 0}}
@media (min-width:1400px){.app{max-width:1500px;font-size:1.15rem}.card{min-height:190px}.card,button{font-size:1.05rem}.panel{padding:42px}.option{min-height:58px}.logo{font-size:clamp(5rem,6.5vw,8rem)}}
@media (hover:hover){button:hover:not(:disabled){filter:brightness(.97)}}
</style></head><body><main id="app"></main><script>
'use strict';
const app=document.getElementById('app'), KEY='misi-kuadrat-v1'; let db={students:{},current:''},memoryOnly=false,screen='',timer=null,game=null;
try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){memoryOnly=true} if(!db.students)db={students:{},current:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));memoryOnly=false}catch(e){memoryOnly=true} const el=document.getElementById('storage');if(el)el.textContent=memoryOnly?'Penyimpanan tidak tersedia; data hanya bertahan selama sesi ini.':'Data disimpan di browser ini.'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function student(){return db.students[db.current]}function stop(){if(timer){clearInterval(timer);clearTimeout(timer);timer=null}}function show(html){app.innerHTML=html;window.scrollTo(0,0)}function shell(title,content,nav=''){show(`<div class="app"><header><div><span class="tag">MISI KUADRAT</span><h1>${title}</h1></div><div class="small">${student()?esc(student().name)+' · '+esc(student().kelas):''}<br><span id="storage"></span></div></header><section class="panel">${content}${nav}</section></div>`);save()}function nav(back,next,label='Selanjutnya'){return `<nav class="nav"><button onclick="${back}">Kembali</button><button onclick="menu()">Menu Utama</button><button class="primary" onclick="${next}">${label}</button></nav>`}
const world=`<svg viewBox="0 0 500 380" role="img" aria-label="Ilustrasi observatorium geometris"><circle cx="390" cy="65" r="40" fill="#fff6e4"/><path d="M20 325 Q100 210 210 310 Q330 180 485 325Z" fill="#70b5a7"/><path d="M140 300V160 Q250 30 360 160V300Z" fill="#fff6e4" stroke="#173b62" stroke-width="8"/><path d="M140 160Q250 30 360 160Z" fill="#8066b0" stroke="#173b62" stroke-width="8"/><path d="M215 300v-70a35 35 0 0 1 70 0v70" fill="#38a99c" stroke="#173b62" stroke-width="8"/><circle cx="250" cy="165" r="35" fill="#cbeaf4" stroke="#173b62" stroke-width="6"/><path d="M250 165l22-20M250 165l-6 25" stroke="#f29b38" stroke-width="7"/><circle cx="400" cy="280" r="38" fill="#38a99c" stroke="#173b62" stroke-width="6"/><path d="M400 280l18-20-9 27z" fill="#f29b38"/><circle cx="388" cy="273" r="3"/><circle cx="410" cy="273" r="3"/><path d="M390 292q10 8 20 0" fill="none" stroke="#173b62" stroke-width="3"/></svg>`;
function cover(){stop();screen='cover';show(`<div class="cover"><div><p class="tag">MATEMATIKA · KELAS X</p><h1 class="logo">MISI KUADRAT<br><span style="font-size:.55em">JELAJAH AKAR IMAJINER</span></h1><p>Jelajahi persamaan, grafik parabola, dan akar imajiner bersama Kompa.</p><button class="primary" onclick="identity()">Mulai</button></div><div class="world">${world}</div></div>`)}
function identity(){stop();screen='identity';shell('Identitas Siswa',`<p>Masukkan nama dan kelas untuk menyimpan perjalanan belajar di browser ini.</p><div class="fields"><label>Nama<input id="name" maxlength="80" autocomplete="name" value="${student()?esc(student().name):''}"></label><label>Kelas<input id="kelas" maxlength="40" value="${student()?esc(student().kelas):''}" placeholder="Contoh: X AKL 1"></label><p id="error" role="alert"></p><button class="primary" onclick="enter()">Lanjutkan</button></div>`,nav('cover()','enter()','Lanjutkan'))}
function enter(){let name=document.getElementById('name').value.trim(),kelas=document.getElementById('kelas').value.trim();if(!name||!kelas){document.getElementById('error').textContent='Isi nama dan kelas terlebih dahulu.';return}let key=JSON.stringify([name.toLocaleLowerCase('id'),kelas.toLocaleLowerCase('id')]);db.current=key;db.students[key]??={name,kelas,progress:{},quiz:{},draft:{},results:[]};save();menu()}
function menuIcon(kind){const shapes={book:'<path d="M10 15 Q25 10 32 18 Q39 10 54 15 V48 Q40 44 32 51 Q24 44 10 48Z"/>',target:'<circle cx="32" cy="32" r="23"/><circle cx="32" cy="32" r="14"/><circle cx="32" cy="32" r="5" fill="#f29b38"/>',triangle:'<path d="M9 51 L54 51 L54 8 Z"/><path d="M39 51 V38 H54"/>',notes:'<path d="M15 7 H48 V56 H15 Z"/><path d="M22 20 H41 M22 29 H41 M22 38 H37"/>',game:'<path d="M12 50 H52 M20 46 L24 32 Q20 29 22 24 A7 7 0 1 1 34 24 Q36 29 32 32 L36 46Z"/>',pencil:'<path d="M13 50 L16 38 L43 11 L53 21 L26 48Z"/><path d="M16 38 L26 48"/>',info:'<rect x="9" y="13" width="46" height="38" rx="5"/><circle cx="23" cy="28" r="6"/><path d="M15 43 Q23 34 31 43 M36 25 H49 M36 33 H49"/>'};return '<svg width="70" height="70" viewBox="0 0 64 64" fill="#cbeaf4" stroke="#173b62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+shapes[kind]+'</svg>'}
function menu(){stop();screen='menu';let items=[['book','Panduan','guide()'],['target','Tujuan','goals()'],['triangle','Materi','subjects()'],['notes','Rangkuman','summary()'],['game','Game','gameSetup()'],['pencil','Evaluasi','evaluation()'],['info','Info Pengembang','info()']];shell('Menu Utama',`<p>Pilih kegiatan secara bebas. <button onclick="changeStudent()">Ganti Siswa</button></p><div class="grid">${items.map(x=>`<button class="card" onclick="${x[2]}"><span class="icon" aria-hidden="true">${menuIcon(x[0])}</span><span>${x[1]}</span></button>`).join('')}</div><p class="muted small">Ilustrasi sementara berbasis SVG; aset gambar final belum tersedia.</p>`)}function changeStudent(){if(confirm('Ganti siswa? Data siswa saat ini tetap tersimpan di browser ini.')){db.current='';save();identity()}}
function guide(){shell('Panduan',`<ol><li>Pilih <b>Materi</b> untuk belajar lima subbab dalam urutan pilihanmu.</li><li>Setelah setiap subbab, kerjakan dua soal pemeriksaan pemahaman. Setiap soal memiliki dua kesempatan.</li><li>Gunakan <b>Game</b> untuk berlatih sendiri atau bergiliran pada satu perangkat.</li><li>Evaluasi memiliki 10 soal. Draf disimpan; tekan <b>Kirim Jawaban</b> untuk melihat nilai dan pembahasan.</li></ol><p>Data hanya berada pada browser ini. Berbagi nama dan kelas yang sama pada browser ini akan membuka data yang sama.</p>`,nav('menu()','menu()','Selesai'))}
function goals(){shell('Tujuan Pembelajaran',`<p class="tag">USULAN</p><p>Setelah belajar, murid dapat:</p><ol><li>Mengenali persamaan dan fungsi kuadrat.</li><li>Menghitung diskriminan dan menjelaskan jenis akar.</li><li>Menjelaskan satuan imajiner i dengan i² = −1.</li><li>Menentukan akar persamaan kuadrat dengan diskriminan negatif.</li><li>Menghubungkan akar real dengan titik potong grafik terhadap sumbu x.</li></ol>`,nav('menu()','subjects()'))}
const topics=[{"title":"Mengenal bentuk kuadrat","pages":[["Persamaan dan fungsi kuadrat","Persamaan kuadrat berbentuk ax² + bx + c = 0, sedangkan fungsi kuadrat berbentuk f(x) = ax² + bx + c, dengan a ≠ 0. Huruf a, b, dan c menyatakan bilangan real."],["Mengenali koefisien","Pada f(x) = 2x² − 3x + 1, koefisiennya a = 2, b = −3, dan c = 1. Bentuknya tetap kuadrat meskipun b atau c bernilai nol, asalkan a tidak nol."],["Contoh dan bukan contoh","x² + 4 = 0 adalah persamaan kuadrat dengan a = 1, b = 0, c = 4. Sebaliknya 3x + 2 = 0 bukan persamaan kuadrat karena koefisien x² adalah nol."]]},{"title":"Diskriminan dan jenis akar","pages":[["Menghitung diskriminan","Untuk ax² + bx + c = 0, diskriminan adalah D = b² − 4ac. Tanda D membantu mengenali jenis akar sebelum kita menghitung akarnya."],["Apa arti tanda D?","Jika D > 0, ada dua akar real berbeda. Jika D = 0, ada satu akar real kembar. Jika D < 0, ada dua akar kompleks nonreal yang saling berpasangan konjugat."],["Contoh langkah demi langkah","Pada x² + 4 = 0, a = 1, b = 0, c = 4. Maka D = 0² − 4(1)(4) = −16. Karena D < 0, tidak ada akar real; ada dua akar kompleks nonreal."]]},{"title":"Mengenal bilangan imajiner","pages":[["Satuan imajiner","Satuan imajiner i didefinisikan oleh i² = −1. Tidak ada bilangan real yang kuadratnya negatif; bilangan kompleks memperluas sistem bilangan agar persamaan seperti x² = −1 memiliki solusi."],["Akar bilangan negatif","Untuk bilangan real positif k, √(−k) = i√k, dengan √ menyatakan akar kuadrat utama. Misalnya √(−9) = 3i dan √(−12) = 2√3 i."],["Bilangan kompleks dan pasangan","Bilangan kompleks berbentuk a + bi, dengan a dan b real. Pasangan konjugatnya adalah a − bi. Contoh: 2 + 3i dan 2 − 3i; bila b = 0 bilangan tersebut real."]]},{"title":"Menentukan akar imajiner","pages":[["Rumus kuadrat","Untuk ax² + bx + c = 0 dengan a ≠ 0, akar-akarnya adalah x = (−b ± √D)/(2a), dengan D = b² − 4ac. Jika D negatif, ubah √D menjadi bentuk yang memuat i."],["Contoh sederhana","x² + 4 = 0 berarti x² = −4. Dengan mengambil kedua kemungkinan, x = ±√(−4) = ±2i. Kedua akar adalah 2i dan −2i, bukan hanya 2i."],["Contoh menggunakan rumus","Untuk x² − 2x + 5 = 0, D = (−2)² − 4(1)(5) = −16. Maka x = (2 ± 4i)/2 = 1 ± 2i. Substitusi masing-masing akar kembali ke persamaan untuk memeriksa hasil."]]},{"title":"Hubungan akar dan grafik","pages":[["Akar real dan titik potong","Akar real persamaan f(x) = 0 adalah koordinat x pada titik potong grafik y = f(x) dengan sumbu x. Grafik fungsi kuadrat berbentuk parabola."],["Grafik tanpa potongan sumbu x","Pada y = x² + 4, nilai minimum y adalah 4, sehingga grafik berada di atas sumbu x dan tidak memotongnya. Persamaan x² + 4 = 0 tidak memiliki akar real, tetapi memiliki akar kompleks 2i dan −2i."],["Membaca diskriminan dan grafik","Untuk koefisien real dan a ≠ 0, D > 0 berarti dua titik potong dengan sumbu x; D = 0 berarti menyinggung sumbu x; D < 0 berarti tidak memotong sumbu x. Akar nonreal tidak ditampilkan sebagai titik pada sumbu x real."]]}];
const quizzes=[[["Koefisien a pada 2x² − 3x + 1 = 0 adalah ...",["2","−3","1","0"],0,"Koefisien x² adalah 2."],["Manakah yang bukan persamaan kuadrat?",["x² + 4 = 0","2x² − 1 = 0","3x + 2 = 0","−x² = 0"],2,"3x + 2 = 0 tidak memiliki suku x², sehingga a = 0."]],[["Diskriminan x² + 4 = 0 adalah ...",["16","−16","4","−4"],1,"D = 0² − 4(1)(4) = −16."],["Jika D < 0, akar persamaan berkoefisien real adalah ...",["dua akar real berbeda","akar real kembar","dua akar kompleks nonreal","tidak memiliki akar kompleks"],2,"D negatif menghasilkan sepasang akar kompleks nonreal."]],[["Nilai i² adalah ...",["1","−1","i","−i"],1,"Satuan imajiner didefinisikan dengan i² = −1."],["Akar kuadrat utama √(−9) adalah ...",["−3","3i","±3i","9i"],1,"√(−9) = 3i; tanda ± digunakan saat menyelesaikan x² = −9."]],[["Akar-akar x² + 4 = 0 adalah ...",["2 dan −2","2i dan −2i","4i dan −4i","hanya 2i"],1,"x² = −4 menghasilkan x = ±2i."],["Akar-akar x² − 2x + 5 = 0 adalah ...",["1 ± 2i","2 ± i","−1 ± 2i","1 ± 4i"],0,"D = −16, sehingga x = (2 ± 4i)/2 = 1 ± 2i."]],[["Grafik y = x² + 4 terhadap sumbu x ...",["memotong di dua titik","menyinggung di satu titik","tidak memotong","berimpit seluruhnya"],2,"Nilai minimum fungsi adalah 4, di atas sumbu x."],["Jika D = 0, grafik parabola ...",["menyinggung sumbu x","memotong di dua titik","tidak memotong sumbu x","selalu berupa garis lurus"],0,"D = 0 menghasilkan akar real kembar dan satu titik singgung."]]];
function subjects(){let s=student();shell('Daftar Materi',`<p>Pilih subbab. Semua subbab terbuka.</p><div class="grid">${topics.map((t,i)=>`<button class="card" onclick="lesson(${i},0)"><span class="icon" aria-hidden="true">${['∑','Δ','i','±','∩'][i]}</span><span>${i+1}. ${t.title}</span><span class="small">${s.progress[i]==='done'?'Kuis dikerjakan':s.progress[i]?'Sedang belajar':'Belum dibuka'}</span></button>`).join('')}</div>`,nav('menu()','menu()','Selesai'))}
function diagram(i){return `<svg viewBox="0 0 360 250" role="img" aria-label="Grafik y sama dengan x kuadrat ditambah empat. Parabola terbuka ke atas dan tidak memotong sumbu x"><line x1="20" y1="215" x2="340" y2="215" stroke="#173b62" stroke-width="3"/><line x1="180" y1="230" x2="180" y2="15" stroke="#173b62" stroke-width="3"/><path d="M80 25 Q180 300 280 25" fill="none" stroke="#8066b0" stroke-width="6"/><circle cx="180" cy="162.5" r="5" fill="#f29b38"/><text x="190" y="155" fill="#173b62">(0, 4)</text><text x="310" y="205" fill="#173b62">x</text><text x="190" y="25" fill="#173b62">y</text></svg><p class="small">Ilustrasi y = x² + 4: titik minimum (0, 4), di atas sumbu x.</p>`}
function lesson(i,p){screen='lesson';let s=student();if(!s.progress[i])s.progress[i]='started';save();let a=topics[i].pages[p];shell(topics[i].title,`<p class="tag">Subbab ${i+1} · Halaman ${p+1} dari ${topics[i].pages.length}</p><div class="split"><div><h2>${a[0]}</h2><p>${a[1]}</p><p class="muted">Pikirkan: bagaimana contoh ini berkaitan dengan jenis akar dan grafik?</p></div><div class="diagram">${diagram(i)}</div></div>`,nav(p?`lesson(${i},${p-1})`:'subjects()',p<topics[i].pages.length-1?`lesson(${i},${p+1})`:`quiz(${i},0)`))}
function quiz(i,j){let q=quizzes[i][j],key=i+'-'+j,st=student().quiz[key]||{tries:0,done:false};shell('Pemeriksaan Pemahaman',`<p class="tag">${topics[i].title} · Soal ${j+1} dari 2</p><p class="question">${q[0]}</p><div class="stack">${q[1].map((o,k)=>`<button class="option" ${st.done?'disabled':''} onclick="answerQuiz(${i},${j},${k})">${String.fromCharCode(65+k)}. ${o}</button>`).join('')}</div><div class="notice" role="status">${st.done?(st.correct?'Benar. ':'Kesempatan habis. ')+q[3]:`Kesempatan tersisa: ${2-st.tries}.`}</div>`,nav(j?`quiz(${i},${j-1})`:`lesson(${i},${topics[i].pages.length-1})`,st.done?(j===0?`quiz(${i},1)`:'subjects()'):`alert('Jawab soal ini terlebih dahulu.')`,j===1?'Selesai':'Selanjutnya'))}
function answerQuiz(i,j,k){let key=i+'-'+j,st=student().quiz[key]||{tries:0,done:false};if(st.done)return;st.tries++;st.correct=k===quizzes[i][j][2];st.done=st.correct||st.tries>=2;student().quiz[key]=st;if(student().quiz[i+'-0']?.done&&student().quiz[i+'-1']?.done)student().progress[i]='done';save();quiz(i,j)}
function summary(){shell('Rangkuman',`<p>Persamaan kuadrat berbentuk ax² + bx + c = 0 dengan a ≠ 0. Diskriminannya D = b² − 4ac.</p><ul><li>D &gt; 0: dua akar real berbeda.</li><li>D = 0: akar real kembar.</li><li>D &lt; 0: dua akar kompleks nonreal berpasangan konjugat.</li></ul><p>Dengan i² = −1, akar kuadrat utama √(−9) = 3i. Untuk menyelesaikan x² = −9, gunakan kedua akar: x = ±3i.</p><p>Rumus kuadrat: x = (−b ± √D)/(2a). Grafik memotong sumbu x hanya pada akar real.</p>`,nav('menu()','menu()','Selesai'))}function info(){shell('Info Pengembang',`<div class="developer-profile"><img src="./asset/setiarso-safii.jpeg" alt="Foto Setiarso Safii (Kang Arso)" width="250" height="286"><div><h2>Setiarso Safii (Kang Arso)</h2><p><b>Instansi:</b> SMKN 1 Buntok</p></div></div><p>Materi disusun berdasarkan definisi persamaan dan fungsi kuadrat, diskriminan, rumus kuadrat, dan bilangan kompleks. Ilustrasi sementara dibuat dengan kode.</p>`,nav('menu()','menu()','Selesai'))}
const bank=[["Bentuk umum persamaan kuadrat adalah ...",["ax²+bx+c=0, a≠0","ax+b=0","ax³+b=0","ax²+bx+c=0, a=0"],0,"Koefisien x² harus tidak nol."],["Pada x²+4=0, nilai c adalah ...",["0","1","4","−4"],2,"Suku konstanta adalah 4."],["Diskriminan x²+4=0 adalah ...",["16","−16","4","−4"],1,"D = 0² − 4(1)(4) = −16."],["Jika D < 0 maka akarnya ...",["dua akar real berbeda","akar real kembar","dua akar kompleks nonreal","tidak ada akar kompleks"],2,"Akar-akarnya kompleks nonreal dan saling konjugat."],["Nilai i² adalah ...",["1","−1","i","−i"],1,"Menurut definisi, i² = −1."],["Akar kuadrat utama √(−9) adalah ...",["3i","−3i","±3i","9i"],0,"Akar utama √(−9) adalah 3i."],["Akar-akar x²+4=0 adalah ...",["±2","±2i","±4i","2i saja"],1,"x² = −4 sehingga x = ±2i."],["Akar-akar x²−2x+5=0 adalah ...",["1±2i","−1±2i","2±i","1±4i"],0,"D = −16; x = (2 ± 4i)/2."],["Grafik y=x²+4 terhadap sumbu x ...",["memotong dua titik","menyinggung","tidak memotong","berimpit"],2,"Nilai minimumnya 4, di atas sumbu x."],["Jika D=0, grafik fungsi kuadrat ...",["memotong di dua titik","menyinggung sumbu x","tidak memotong sumbu x","selalu berupa garis"],1,"D nol memberikan akar real kembar."],["Diskriminan x²−4=0 adalah ...",["−16","16","4","−4"],1,"D = 0 − 4(1)(−4) = 16."],["Konjugat dari 3+2i adalah ...",["3−2i","−3+2i","−3−2i","2+3i"],0,"Konjugat mengubah tanda bagian imajiner."],["√(−25) sebagai akar utama adalah ...",["5i","−5i","±5i","25i"],0,"√(−25) = 5i."],["Akar-akar x²+9=0 adalah ...",["±3i","±9i","±3","3i saja"],0,"x² = −9 menghasilkan x = ±3i."],["Akar-akar x²+2x+2=0 adalah ...",["−1±i","1±i","−2±i","−1±2i"],0,"D = −4, jadi x = (−2 ± 2i)/2."],["Jika D > 0, jumlah akar real berbeda adalah ...",["0","1","2","3"],2,"Diskriminan positif menghasilkan dua akar real berbeda."],["Koefisien b pada 2x²−3x+1 adalah ...",["2","−3","3","1"],1,"Koefisien x adalah −3."],["Grafik y=x²−1 memotong sumbu x di ...",["x=−1 dan x=1","x=0 saja","tidak ada titik","x=−1 saja"],0,"x² − 1 = 0 memberikan x = ±1."],["Pernyataan yang benar adalah ...",["i²=−1","i²=1","i adalah bilangan real","√(−4)=−2"],0,"i didefinisikan sebagai satuan imajiner dengan i² = −1."],["Bagian real dari 1−2i adalah ...",["1","−2","2i","−2i"],0,"Pada a+bi, bagian real adalah a."]];
let evalIndex=0;function evaluation(n=evalIndex){stop();screen='eval';evalIndex=n;let s=student(),q=bank[n],selected=s.draft[n];shell('Evaluasi Akhir',`<p>Soal ${n+1} dari 10 · Draf tersimpan. Belum ada batas waktu.</p>${s.results.length?`<button onclick="evalResult(${s.results.length-1})">Lihat Hasil Terakhir</button>`:""}<div class="progress"><span style="width:${Object.keys(s.draft).length*10}%"></span></div><div class="row">${Array.from({length:10},(_,i)=>`<button class="${i===n?'primary':''}" aria-label="Soal ${i+1}${s.draft[i]!==undefined?', terjawab':''}" onclick="evaluation(${i})">${i+1}${s.draft[i]!==undefined?' ✓':''}</button>`).join('')}</div><p class="question">${q[0]}</p><div class="stack">${q[1].map((x,k)=>`<button class="option ${selected===k?'selected':''}" aria-pressed="${selected===k}" onclick="evalAnswer(${n},${k})">${String.fromCharCode(65+k)}. ${x}</button>`).join('')}</div><p>${Object.keys(s.draft).length} dari 10 soal terjawab.</p><button class="primary" onclick="submitEval()">Kirim Jawaban</button>`,nav(n?`evaluation(${n-1})`:'menu()',n<9?`evaluation(${n+1})`:'evaluation(0)',n<9?'Selanjutnya':'Soal pertama'))}function evalAnswer(n,k){student().draft[n]=k;save();evaluation(n)}function submitEval(){let s=student(),count=Object.keys(s.draft).length;if(!confirm(`Kirim jawaban? ${count} dari 10 soal terjawab. Soal kosong dinilai salah.`))return;let answers={...s.draft},score=bank.slice(0,10).reduce((v,q,i)=>v+(answers[i]===q[2]?10:0),0);s.results.push({answers,score});s.draft={};save();evalResult(s.results.length-1)}function evalResult(idx){let r=student().results[idx];shell('Hasil Evaluasi',`<p class="score">${r.score} / 100</p><p>Target latihan MPI: 80. ${r.score>=80?'Target latihan tercapai.':'Target latihan belum tercapai; pelajari pembahasan dan coba lagi.'} Ini bukan ketuntasan resmi sekolah.</p>${bank.slice(0,10).map((q,i)=>`<article class="notice"><b>${i+1}. ${q[0]}</b><p>Jawabanmu: ${r.answers[i]===undefined?'Belum dijawab':esc(q[1][r.answers[i]])}. Kunci: ${esc(q[1][q[2]])}.</p><p>${q[3]}</p></article>`).join('')}<button class="primary" onclick="evaluation(0)">Ulangi Evaluasi</button>`,nav('menu()','menu()','Selesai'))}
const gameBank=bank.concat(bank.map((q,i)=>[`Pilih pernyataan yang benar: ${q[0]}`,q[1],q[2],q[3]]));
function gameSetup(){stop();game=null;screen='setup';shell('Balap Pion Kuadrat',`<p>Jawab dengan benar untuk menggerakkan pion. Setiap pemain mendapat lima giliran setara; jawaban benar bernilai satu poin. Waktu setiap giliran 30 detik.</p><div class="fields"><label>Mode<select id="mode" onchange="setupFields()"><option value="solo">Solo: target 4 poin</option><option value="bot">Lawan BOT</option><option value="two">2 pemain lokal</option><option value="four">4 pemain lokal</option></select></label><div id="players"></div><div id="botsettings"></div><button class="primary" onclick="startGame()">Mulai Game</button></div>`,nav('menu()','menu()','Selesai'));setupFields()}
function setupFields(){let mode=document.getElementById('mode').value,n=mode==='four'?4:mode==='two'?2:1;document.getElementById('players').innerHTML=Array.from({length:n},(_,i)=>`<label>Nama panggilan P${i+1}<input id="p${i}" maxlength="24" value="${i===0?esc(student().name):'Pemain '+(i+1)}"></label>`).join('');document.getElementById('botsettings').innerHTML=mode==='bot'?`<label>Tingkat BOT<select id="difficulty"><option value="easy">Mudah · 60% · 4 detik</option><option value="medium" selected>Sedang · 75% · 3 detik</option><option value="hard">Sulit · 88% · 2 detik</option></select></label>`:''}
function startGame(){let mode=document.getElementById('mode').value,n=mode==='four'?4:mode==='two'?2:1,names=Array.from({length:n},(_,i)=>document.getElementById('p'+i).value.trim()||'Pemain '+(i+1));if(mode==='bot')names.push('BOT');let diff=mode==='bot'?document.getElementById('difficulty').value:null;let order=Array.from({length:gameBank.length},(_,i)=>i).sort(()=>Math.random()-.5);game={mode,names,diff,scores:names.map(()=>0),round:0,player:0,order,phase:'countdown',seconds:3,history:[],tiePlayers:[],tieRound:0,tieScores:{},paused:false,botChoice:null,botRemaining:0};countdown()}
function countdown(){stop();game.phase='countdown';shell('Bersiap!',`<p class="score" id="count">${game.seconds}</p><p>Setiap pemain menjawab bergiliran di perangkat ini.</p><button onclick="gameSetup()">Batal</button>`);timer=setInterval(()=>{game.seconds--;let e=document.getElementById('count');if(e)e.textContent=game.seconds;if(game.seconds<=0){stop();beginTurn()}},1000)}
function currentQuestion(){let idx=game.phase==='tie'?5+(game.tieRound%35):game.round;return gameBank[game.order[idx]]}function beginTurn(){stop();game.phase=game.tiePlayers.length?'tie':'playing';game.seconds=30;game.locked=false;game.paused=false;game.botChoice=null;let isBot=game.mode==='bot'&&game.player===1;if(isBot){let settings={easy:[.60,4],medium:[.75,3],hard:[.88,2]}[game.diff],q=currentQuestion();game.botChoice=Math.random()<settings[0]?q[2]:(q[2]+1+Math.floor(Math.random()*3))%4;game.botRemaining=settings[1]}renderGame();tickGame()}
function tickGame(){stop();timer=setInterval(()=>{if(!game||game.paused)return;game.seconds--;if(game.botChoice!==null){game.botRemaining--;if(game.botRemaining<=0){let choice=game.botChoice;game.botChoice=null;gradeGame(choice);return}}if(game.seconds<=0){gradeGame(null);return}let e=document.getElementById('clock');if(e)e.textContent=game.seconds},1000)}
function renderGame(){let q=currentQuestion(),bot=game.mode==='bot'&&game.player===1;let tracks=game.names.map((name,i)=>`<div><b>${esc(name)}${i===game.player?' · giliran':''}</b> · ${game.scores[i]} poin<div class="track">${Array.from({length:6},(_,k)=>`<span class="step ${Math.min(game.scores[i],5)===k?'active':''}">${k===Math.min(game.scores[i],5)?'●':k}</span>`).join('')}</div></div>`).join('');shell('Balap Pion Kuadrat',`<div class="split"><div><p class="tag">${game.tiePlayers.length?'Babak penentu '+(game.tieRound+1):'Ronde '+(game.round+1)+' dari 5'}</p>${tracks}</div><div><p>Giliran <b>${esc(game.names[game.player])}</b> · Sisa <b id="clock">${game.seconds}</b> detik</p><p class="question">${q[0]}</p><div class="stack">${q[1].map((x,k)=>`<button class="option" ${bot||game.paused?'disabled':''} onclick="gradeGame(${k})">${String.fromCharCode(65+k)}. ${x}</button>`).join('')}</div>${bot?'<p>BOT sedang memilih.</p>':''}</div></div><div class="row" style="margin-top:20px"><button onclick="pauseGame()">${game.paused?'Lanjutkan':'Jeda'}</button><button onclick="resetGame()">Reset Game</button><button onclick="leaveGame()">Menu Utama</button></div>${game.paused?'<p class="notice">Permainan dijeda.</p>':''}`)}
function pauseGame(){if(!game||game.locked)return;game.paused=!game.paused;if(game.paused)stop();else tickGame();renderGame()}function resetGame(){if(confirm('Reset permainan ini dan kembali ke pengaturan?'))gameSetup()}function leaveGame(){if(confirm('Keluar dari permainan ini dan kembali ke menu?')){stop();game=null;menu()}}
function gradeGame(k){if(!game||game.locked||game.paused)return;stop();game.locked=true;let q=currentQuestion(),correct=k===q[2];if(game.tiePlayers.length)game.tieScores[game.player]=(game.tieScores[game.player]||0)+(correct?1:0);else if(correct)game.scores[game.player]++;game.history.push({player:game.names[game.player],correct,question:q[0]});game.phase='feedback';shell('Umpan Balik',`<p class="tag">${esc(game.names[game.player])}</p><h2>${k===null?'Waktu habis':correct?'Benar!':'Belum tepat'}</h2><p>Jawaban yang benar: <b>${esc(q[1][q[2]])}</b>.</p><p>${q[3]}</p><p>${game.tiePlayers.length?'Poin babak penentu': 'Poin bermain'}: ${correct?'1':'0'}</p><button class="primary" onclick="nextTurn()">Giliran Berikutnya</button><button onclick="leaveGame()">Menu Utama</button>`)}
function nextTurn(){if(!game||game.phase!=='feedback')return;if(game.tiePlayers.length){let pos=game.tiePlayers.indexOf(game.player);if(pos<game.tiePlayers.length-1){game.player=game.tiePlayers[pos+1];beginTurn();return}let max=Math.max(...game.tiePlayers.map(i=>game.tieScores[i]||0));let winners=game.tiePlayers.filter(i=>(game.tieScores[i]||0)===max);if(winners.length===1){game.winner=winners[0];gameResult();return}game.tiePlayers=winners;game.tieRound++;game.tieScores={};game.player=winners[0];beginTurn();return}game.player++;if(game.player>=game.names.length){game.player=0;game.round++}if(game.round>=5){if(game.mode==='solo'){gameResult();return}let max=Math.max(...game.scores),winners=game.scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);if(winners.length===1){game.winner=winners[0];gameResult();return}game.tiePlayers=winners;game.tieRound=0;game.tieScores={};game.player=winners[0]}beginTurn()}
function gameResult(){stop();game.phase='result';let result=game.mode==='solo'?(game.scores[0]>=4?'Target tercapai!':'Target belum tercapai. Coba lagi!'):`Pemenang: ${esc(game.names[game.winner])}`;shell('Hasil Game',`<h2>${result}</h2><p>Skor game terpisah dari nilai evaluasi.</p>${game.names.map((n,i)=>`<p><b>${esc(n)}</b>: ${game.scores[i]} / 5 poin bermain</p>`).join('')}<p>Jawaban selama permainan:</p><ul>${game.history.map(h=>`<li>${esc(h.player)}: ${esc(h.question)} — ${h.correct?'benar':'belum tepat'}</li>`).join('')}</ul><button class="primary" onclick="gameSetup()">Main Lagi</button>`,nav('menu()','menu()','Selesai'))}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game&&(game.phase==='playing'||game.phase==='tie')&&!game.paused)pauseGame()});
cover();

</script></body></html>
